# Boundary-First Development — the Go gate (BFD-17).
# https://codeberg.org/galaxi/boundary-first-development — RULES.md is the law;
# this file is that law in golangci-lint's dialect. Copy it next to your go.mod
# as .golangci.yml. Extend it freely — the five enabled linters below are the
# floor `bfd conform` checks for, not a ceiling.
version: "2"

linters:
  default: standard # govet, staticcheck, and friends stay on
  enable:
    - exhaustive # BFD-3: enumerated codes are handled exhaustively
    - forbidigo # BFD-12: UTC only; local time is display-layer business
    - godox # BFD-29: a marker is deferred work, and deferred work does not ship
    - ireturn # BFD-16: an empty-interface return is a hole in the contract
    - nolintlint # BFD-29: suppressions are exceptions, and there are no exceptions
    - revive # BFD-15: single-struct arguments, no boolean control coupling
    - tagliatelle # BFD-11: camelCase on the wire, translated at the boundary
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    godox:
      keywords: [TODO, FIXME, HACK, XXX, BUG, OPTIMIZE]
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Local$
          msg: "BFD-12: timestamps are stored and transmitted in UTC; local time exists only in the display layer"
    ireturn:
      reject:
        - empty # interface{} / any never crosses a boundary
    nolintlint:
      allow-unused: false # BFD-29: a suppression guarding nothing is dead weight
      require-explanation: true # if it must exist, it must be defended in writing
      require-specific: true # a blanket nolint is a hole of unknown size
    revive:
      rules:
        - name: flag-parameter # BFD-15: a trailing boolean is not an argument, it is two functions
        - name: argument-limit # BFD-15: one payload struct, plus what Go itself mandates — (w, r) or ctx — and nothing else
          arguments: [3]
    tagliatelle:
      case:
        rules:
          json: camel # BFD-11: json tags speak camelCase

formatters:
  enable:
    - gofmt # BFD-17: style is not a discussion
